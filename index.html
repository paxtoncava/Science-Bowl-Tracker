<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Science Bowl Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <!-- Firebase Firestore (for database storage) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <h1>🧪 Science Bowl Stats & Set Tracker</h1>
  </header>

  <main>
    <!-- Practice Entry Form -->
    <section class="card">
      <h2>Record New Practice Session</h2>
      <form id="sessionForm">
        <div class="form-group">
          <label for="setDate">Date:</label>
          <input type="date" id="setDate" required />
        </div>
        <div class="form-group">
          <label for="setName">NSB Set Used (e.g., HS Reg 2023 Set 1):</label>
          <input type="text" id="setName" placeholder="NSB Set & Round..." required />
        </div>

        <hr />
        <h3>Add Team (Up to 5 Players)</h3>
        <div class="form-group">
          <label for="teamName">Team Name/Identifier (e.g., Team A):</label>
          <input type="text" id="teamName" placeholder="Team Name" required />
        </div>
        <div id="playersContainer">
          <p>Enter Player Names & Toss-ups/Bonuses Correct:</p>
          <div class="player-input">
            <input type="text" class="player-name" placeholder="Player 1 Name" required />
            <input type="number" class="player-score" placeholder="Tossups Correct" min="0" value="0" />
          </div>
          <div class="player-input">
            <input type="text" class="player-name" placeholder="Player 2 Name" />
            <input type="number" class="player-score" placeholder="Tossups Correct" min="0" value="0" />
          </div>
          <div class="player-input">
            <input type="text" class="player-name" placeholder="Player 3 Name" />
            <input type="number" class="player-score" placeholder="Tossups Correct" min="0" value="0" />
          </div>
          <div class="player-input">
            <input type="text" class="player-name" placeholder="Player 4 Name" />
            <input type="number" class="player-score" placeholder="Tossups Correct" min="0" value="0" />
          </div>
          <div class="player-input">
            <input type="text" class="player-name" placeholder="Player 5 Name" />
            <input type="number" class="player-score" placeholder="Tossups Correct" min="0" value="0" />
          </div>
        </div>

        <button type="submit" class="btn">Save Practice Session</button>
      </form>
    </section>

    <!-- Player Leaderboard -->
    <section class="card">
      <h2>Player Leaderboards</h2>
      <table id="leaderboardTable">
        <thead>
          <tr>
            <th>Player Name</th>
            <th>Sessions Played</th>
            <th>Total Tossups Correct</th>
            <th>Avg Tossups/Session</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </section>

    <!-- Sets History -->
    <section class="card">
      <h2>Used NSB Sets Log</h2>
      <ul id="setsList">
        <!-- Dynamically populated -->
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
